<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Love Letter to Glasgow</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <!-- Roughens the narrative strokes as if scratched into film emulsion. -->
    <svg width="0" height="0" class="svg-defs" aria-hidden="true" focusable="false">
      <filter id="filmScratch" x="-15%" y="-40%" width="130%" height="180%" color-interpolation-filters="sRGB">
        <feTurbulence type="fractalNoise" baseFrequency="0.018 0.26" numOctaves="2" seed="7" result="noise" />
        <feDisplacementMap in="SourceGraphic" in2="noise" scale="4.2" xChannelSelector="R" yChannelSelector="G" />
      </filter>
    </svg>

    <div class="page-shell">
      <header class="hero-screen" id="heroScreen">
        <div class="hero-scene">
          <div class="hero-copy">
            <p class="eyebrow">Love Letter to Glasgow</p>
            <h1>Street Photography by Andrew Seywright</h1>
            <p class="subtitle">
              A photobook for my Glasgow work, shaped to feel closer to a real object than a gallery.
            </p>
            <div class="hero-actions">
              <button id="openBookBtn" class="button button-primary">Open the book</button>
            </div>
          </div>

          <div class="hero-preview" aria-hidden="true">
            <div class="closed-book-shadow"></div>
            <div class="closed-book">
              <div class="closed-book-spine"></div>
              <div class="closed-book-cover">
                <img src="Images/Cover.jpg" alt="" />
                <div class="cover-grid"></div>
                <div class="cover-image-frame"></div>
                <div class="cover-tape">
                  <span class="cover-tape-title">Love Letter to Glasgow</span>
                  <span class="cover-tape-note">Fragments from the street</span>
                </div>
                <div class="cover-spine-note">For Fern</div>
                <div class="cover-hinge-shadow"></div>
                <div class="cover-vignette"></div>
              </div>
            </div>
          </div>
        </div>
      </header>

      <main class="book-shell hidden" id="bookShell" aria-live="polite">
        <div class="book-meta">
          <div class="book-title">
            <span>Love Letter To</span>
            <strong>Glasgow</strong>
          </div>
          <div class="book-progress" id="bookProgress">Spread 1 / 1</div>
        </div>

        <div class="book-stage">
          <div class="book-drop-shadow"></div>

          <div class="book" id="book">
            <div class="book-board">
              <div class="page-stack page-stack-left"></div>
              <div class="page-stack page-stack-right"></div>

              <div class="page-bed">
                <div class="spine-glow"></div>
                <div class="page page-left" id="leftPage"></div>
                <div class="page page-right" id="rightPage"></div>

                <div class="flip-sheet hidden" id="flipSheet" aria-hidden="true">
                  <div class="sheet-face sheet-front" id="sheetFront"></div>
                  <div class="sheet-face sheet-back" id="sheetBack"></div>
                  <div class="sheet-shade sheet-shade-front" id="sheetShadeFront"></div>
                  <div class="sheet-shade sheet-shade-back" id="sheetShadeBack"></div>
                </div>
              </div>
            </div>
          </div>
        </div>

        <div class="spread-caption" id="spreadCaption" hidden>
          <p></p>
        </div>

        <div class="book-controls">
          <button class="nav-arrow nav-arrow-prev" id="prevBtn" type="button" aria-label="Previous spread">
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path d="M15 4.5 7.5 12l7.5 7.5" />
            </svg>
          </button>
          <button class="control-cover" id="coverBtn" type="button" aria-label="Return to cover">
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path d="M6 4.5h10.5a2 2 0 0 1 2 2v11.5a1.5 1.5 0 0 1-1.5 1.5H6.5A2.5 2.5 0 0 0 4 22V7a2.5 2.5 0 0 1 2-2.45Z" />
              <path d="M6.5 6H18" />
              <path d="M6.5 20H18" />
            </svg>
          </button>
          <div class="progress-track" aria-hidden="true">
            <span class="progress-fill" id="progressFill"></span>
          </div>
          <button class="nav-arrow nav-arrow-next" id="nextBtn" type="button" aria-label="Next spread">
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path d="m9 4.5 7.5 7.5L9 19.5" />
            </svg>
          </button>
        </div>
      </main>
    </div>

    <!-- GSAP drives the page-turn timing. If it fails to load, the turn falls
         back to the CSS keyframe animation (see playTurn in script.js). -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="script.js"></script>
  </body>
</html>
